<script>
/* Load data and app with a version tag, so a phone never mixes a new app with old cached data. */
(function () {
  var V = '36';
  function load(src, cb) { var s = document.createElement('script'); s.src = src + '?v=' + V; s.onload = cb || null; document.body.appendChild(s); }
  load('data.js', function () {
    if (!window.VULCA || !window.VULCA.strategy) {
      try { if (!sessionStorage.getItem('vulca-reload')) { sessionStorage.setItem('vulca-reload', '1'); location.reload(); return; } } catch (e) {}
    }
    load('app.js');
  });
})();
</script>
